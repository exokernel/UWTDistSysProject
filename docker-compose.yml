services:
  todo-app:
    build: .
    container_name: crdt-todo
    ports:
      - "3000:3000"
    volumes:
      # Persist Automerge document data
      - todo-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

volumes:
  todo-data:
    driver: local
