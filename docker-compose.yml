services:
  # Node 1 - Sync server
  node1:
    build: .
    container_name: crdt-todo-node1
    ports:
      - "3001:3000"
    volumes:
      - node1-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_NAME=node1
      # Connect to node2 using Docker's internal DNS
      - PEER_URLS=ws://node2:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Node 2 - Sync server  
  node2:
    build: .
    container_name: crdt-todo-node2
    ports:
      - "3002:3000"
    volumes:
      - node2-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_NAME=node2
      # Connect back to node1 for bidirectional sync
      - PEER_URLS=ws://node1:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  node1-data:
    driver: local
  node2-data:
    driver: local
